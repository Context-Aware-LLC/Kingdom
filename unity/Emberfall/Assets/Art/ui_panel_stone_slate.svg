<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="none">
  <title>Emberfall UI panel — dressed slate</title>
  <desc>A cool, low-detail carved slate surface for deck-builder panels. The finished artwork is 65 percent opaque and has a quiet content field.</desc>
  <defs>
    <linearGradient id="panel-slate-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56636d"/>
      <stop offset="0.52" stop-color="#424d57"/>
      <stop offset="1" stop-color="#303942"/>
    </linearGradient>
    <linearGradient id="panel-slate-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9baab2" stop-opacity="0.38"/>
      <stop offset="0.18" stop-color="#72818b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#131a20" stop-opacity="0.42"/>
    </linearGradient>
    <clipPath id="panel-slate-clip">
      <rect x="0" y="0" width="1200" height="800" rx="28"/>
    </clipPath>
  </defs>

  <g opacity="0.85" clip-path="url(#panel-slate-clip)">
    <rect width="1200" height="800" fill="url(#panel-slate-base)"/>

    <!-- Broad planes keep the material visible without fighting cards and labels. -->
    <path d="M0 0 H430 L353 191 L0 232 Z" fill="#84919a" opacity="0.30"/>
    <path d="M430 0 H936 L882 166 L353 191 Z" fill="#65737d" opacity="0.18"/>
    <path d="M936 0 H1200 V240 L882 166 Z" fill="#78868f" opacity="0.19"/>
    <path d="M0 232 L353 191 L472 482 L0 527 Z" fill="#303a43" opacity="0.20"/>
    <path d="M353 191 L882 166 L784 506 L472 482 Z" fill="#69757e" opacity="0.155"/>
    <path d="M882 166 L1200 240 V558 L784 506 Z" fill="#28323b" opacity="0.19"/>
    <path d="M0 527 L472 482 L419 800 H0 Z" fill="#67737c" opacity="0.17"/>
    <path d="M472 482 L784 506 L862 800 H419 Z" fill="#303942" opacity="0.22"/>
    <path d="M784 506 L1200 558 V800 H862 Z" fill="#697680" opacity="0.16"/>

    <!-- Sparse bedding lines and flecks. -->
    <path d="M88 172 C238 150 328 170 471 149 C636 125 755 154 917 131 C1015 117 1097 128 1160 119" fill="none" stroke="#9aa8b0" stroke-width="3" opacity="0.20"/>
    <path d="M61 590 C206 569 337 600 503 574 C678 546 823 584 985 555 C1067 541 1128 547 1182 541" fill="none" stroke="#172027" stroke-width="5" opacity="0.26"/>
    <path d="M108 648 L164 638 L202 646 M993 229 L1048 220 L1093 230 M663 92 L716 84 L752 91" fill="none" stroke="#aab5bb" stroke-width="2" opacity="0.30"/>
    <path d="M149 361 l14 -6 l12 5 l-17 6 Z M1035 652 l18 -7 l15 5 l-20 7 Z M730 386 l12 -4 l10 4 l-13 5 Z" fill="#bac3c8" opacity="0.26"/>

    <!-- Carved frame: 48 px is the recommended nine-slice inset. -->
    <rect x="4" y="4" width="1192" height="792" rx="24" fill="none" stroke="url(#panel-slate-edge)" stroke-width="8"/>
    <rect x="20" y="20" width="1160" height="760" rx="15" fill="none" stroke="#111820" stroke-width="3" opacity="0.78"/>
    <path d="M48 30 H1152 M38 47 V753" fill="none" stroke="#c2ccd1" stroke-width="2" opacity="0.12"/>
    <path d="M48 770 H1152 M1162 47 V753" fill="none" stroke="#10161c" stroke-width="4" opacity="0.52"/>

    <!-- Corner chisel marks sit fully inside the slice-safe border. -->
    <path d="M24 86 L61 49 L104 39 M1176 86 L1139 49 L1096 39 M24 714 L61 751 L104 761 M1176 714 L1139 751 L1096 761" fill="none" stroke="#a8b3ba" stroke-width="3" opacity="0.36"/>
  </g>
</svg>
