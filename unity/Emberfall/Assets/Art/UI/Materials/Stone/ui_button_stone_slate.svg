<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="128" viewBox="0 0 600 128" preserveAspectRatio="none">
  <title>Emberfall UI button — carved slate</title>
  <desc>A quiet blue-grey stone slat for 300 by 64 pixel main-menu buttons. The finished artwork is 65 percent opaque.</desc>
  <defs>
    <linearGradient id="slate-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#596571"/>
      <stop offset="0.45" stop-color="#46515c"/>
      <stop offset="1" stop-color="#303842"/>
    </linearGradient>
    <linearGradient id="slate-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a4b1ba" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#c2cbd0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#80909c" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="slate-clip">
      <rect x="0" y="0" width="600" height="128" rx="12"/>
    </clipPath>
  </defs>

  <g opacity="0.65" clip-path="url(#slate-clip)">
    <rect width="600" height="128" fill="url(#slate-base)"/>
    <path d="M0 20 L102 10 L186 27 L294 13 L388 24 L486 8 L600 21 L600 0 L0 0 Z" fill="#9ba9b3" opacity="0.09"/>
    <path d="M0 100 L82 91 L171 108 L273 94 L379 106 L482 88 L600 103 L600 128 L0 128 Z" fill="#151b22" opacity="0.20"/>
    <path d="M0 66 L118 59 L217 68 L328 55 L438 66 L527 58 L600 62 L600 79 L489 73 L391 81 L286 69 L184 81 L84 70 L0 76 Z" fill="url(#slate-sheen)"/>

    <!-- Facets stay near the ends so the label zone remains calm. -->
    <path d="M0 0 H118 L93 42 L0 54 Z" fill="#71808b" opacity="0.16"/>
    <path d="M0 54 L93 42 L127 128 H0 Z" fill="#252d36" opacity="0.15"/>
    <path d="M600 0 H492 L519 45 L600 58 Z" fill="#6c7a85" opacity="0.13"/>
    <path d="M600 58 L519 45 L484 128 H600 Z" fill="#242c34" opacity="0.16"/>

    <!-- Small chips and mineral seams. -->
    <path d="M25 32 L62 27 L85 34 L59 38 Z M516 92 L548 83 L578 88 L553 96 Z" fill="#b1bcc3" opacity="0.18"/>
    <path d="M14 105 L47 93 L80 99 M531 26 L558 36 L591 29" fill="none" stroke="#1a2027" stroke-width="3" opacity="0.42"/>
    <path d="M39 100 L49 95 L56 97 M550 34 L559 37 L568 34" fill="none" stroke="#87959f" stroke-width="1.5" opacity="0.36"/>

    <!-- Carved top light and bottom groove. -->
    <path d="M12 2 H588" stroke="#c4cdd2" stroke-width="3" opacity="0.30"/>
    <path d="M8 124 H592" stroke="#11161c" stroke-width="5" opacity="0.70"/>
    <path d="M12 119 H588" stroke="#77848e" stroke-width="2" opacity="0.18"/>
  </g>
</svg>
