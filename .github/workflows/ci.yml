name: Emberfall CI — determinism gates

# The 9-stage CI pipeline (hist-docs/source-snapshots/2026-07-31-pre-reorganization/testing/ci-gates.md §2). At M1 there is NO paid Unity seat
# (ci-gates.md §7 Q1), so the hard gates run as pure .NET, license-free:
#
#   Stage 1  Lint + vocabulary + rebaseline-guard      BLOCKING   (format + vocabulary + golden path-pair)
#   Stage 2  Core unit tests              BLOCKING   (L1)
#   Stage 3  Contract / interface tests   BLOCKING   (L2)
#   Stage 3b Collection + CardValidation  BLOCKING   (ran in NO stage before 2026-08-01)
#   Stage 4  Assembly firewall + banned   BLOCKING   (criterion 7 — zero UnityEngine, no float-in-state)
#   Stage 5  Golden-replay (R1 gate)      BLOCKING   (criterion 6 — the most important M1 deliverable)
#   Stage 5b Networked AI soak            BLOCKING as of EF-077 (real AI, real sockets, real server)
#   ─────────────────────────────────────────────────────────────────────────────────────────────
#   Stage 6  Content C-series             BLOCKING as of M2 (WS C3 — pure-.NET CardCi over *.cards.json)
#   Stage 6b Trigger/selector drift guard BLOCKING as of EF-032a (validator list vs the interpreter switch)
#   Stage 7  Content E-series (Unity)     informational at M1 (no seat — becomes blocking at M2)
#   Stage 8  Unity PlayMode integration   informational at M1 (no seat — becomes blocking at M2)
#   Stage 9  On-device perf gate (D8)     manual device job at the milestone boundary (not per-PR)
#
# => Every stage marked BLOCKING above runs here. This line used to restate that as a number; it was
#    wrong by the time EF-077 read it, so the map above and the steps below are the only list.
#    Runs on Linux x64 on purpose: baking the golden fixtures on a
#    Windows dev box and asserting them on a Linux runner proves the little-endian, platform-independent
#    canonical hash (golden-replay.md §4.4).

# ─────────────────────────────────────────────────────────────────────────────────────────────
# NO PER-PUSH CI. Sam's ruling, 2026-08-13. Read this before re-adding a `push:` or
# `pull_request:` trigger, because the reasoning is a budget, not a preference.
#
# THE MEASUREMENT. Aug 1-13 — 13 days of a 30-day cycle — burned 1756 of the 2000 free minutes
# on this repo alone: 436 runs at ~3.5 billed minutes each. GitHub rounds every JOB up to a whole
# minute, so 1531 wall-clock minutes billed as 1756; that rounding is also why splitting these
# stages into parallel jobs would cost MORE, not less. Per-run cost is essentially fixed (build
# alone is 28s, and the two fat stages are `dotnet format` at ~55s and the contract tests at
# ~72s), so the only lever that exists is run count. Surviving to the Sept 1 reset on the
# remaining ~244 minutes allows about 3 runs per day. Per-push CI cannot fit in that at any
# trigger granularity, so it is gone rather than crippled.
#
# WHERE THE MINUTES WENT, so a future reader does not re-litigate the cheap fixes first:
#   master pushes  230 runs, ~920 min (52%)   <- this trigger, the whole reason for this block
#   PR runs        170 runs, ~681 min (39%)
#   feat/fix push   27 runs, ~108 min          <- duplicates, removed earlier the same day
#   nightly/agents   ~47 min
# Dependency caching was measured and REJECTED: `dotnet restore` takes 5-8 seconds, so caching it
# saves ~2%. Do not re-propose it as the fix; it is generic advice that does not apply here.
#
# WHAT REPLACES IT. `tools/ci/gates.ps1` runs this exact stage list locally, free, in ~90s — it
# is the pre-push gate now, alongside `unity-compile.ps1` for the Unity half. The daily schedule
# below is the regression net; `workflow_dispatch` is how you gate something that matters (it
# accepts a branch, so you can point it at a PR head).
#
# ACCEPTED RISK. Solo developer, no stakeholders, pre-release. Master can go red between daily
# runs and that is a deliberate trade against a metered bill, NOT an oversight.
#
# RETIREMENT TRIGGER: a paid plan, a second developer, or anything with a stakeholder. Restore
# `pull_request: [master]` FIRST (it gates agent work, which never runs the local script) and
# leave push alone — the concurrency block below already exists to make that affordable.
# ─────────────────────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      nightly:
        description: "Also run the slow Category=Nightly corpus"
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily — the one scheduled full pass

# The pre-2026-08-13 triggers, kept verbatim so restoring them is a copy rather than a rewrite:
#
#   push:
#     branches: [ master ]
#   pull_request:
#     branches: [ master ]
#
# Historical note on why `push` had narrowed to master by then:
    # `agent/**` IS DELIBERATELY ABSENT — do not re-add it. EF-002 put it here and was right
    # to: while agents were told "leave commits local, do not push", a pushed agent branch was
    # the only artifact CI could ever see. That stopped being true on 2026-08-01, when the
    # operator checkpoint moved from push to MERGE and agents began opening a PR on every
    # branch. `pull_request` below already re-fires on every push to a branch with an open PR,
    # so listing `agent/**` here bought nothing and ran the whole pipeline twice on the same
    # commit — measured, 2 runs vs 1. A branch pushed and never PR'd is now a rule violation,
    # and "no CI ran" surfaces that better than silently spending the minute budget on it.
    # `feat/**` and `fix/**` then LEFT for the same reason on 2026-08-13: the note above had
    # stopped at `agent/**` and called the double-run fixed, and it was not. `pull_request`
    # re-fired on every push to ANY branch with an open PR, so a hand-pushed `feat/**` that
    # then got a PR ran the identical SHA twice — 19 commits, ~76 billed minutes, zero extra
    # signal. Hours later the budget math above retired the remaining triggers outright.

# Supersede in-flight runs of the SAME pull request. Dormant while the triggers above are
# schedule/dispatch only — kept because it is the thing that makes `pull_request` affordable
# to restore, and rediscovering it would cost another billing cycle. Without this, three commits pushed to a PR
# in ten minutes bought three full pipelines, two of them gating code already replaced —
# measured, 57 superseded runs and ~228 billed minutes in the Aug 1-13 cycle alone.
#
# `cancel-in-progress` is DELIBERATELY FALSE ON master. Master is not merely the merge of PRs
# already gated: 230 pushes landed there in that cycle against 104 merged PRs, so a large share
# of master commits never saw a PR and this workflow is their ONLY gate. Cancelling a superseded
# master run would leave those commits ungated and green-by-omission. Every master commit gets
# its own run; only PR/branch runs are cancellable.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  determinism-gates:
    name: Hard gates (pure .NET, license-free)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      # ACTION MAJORS. Every one of these must declare `runs.using: node24`. The @v4 line of all
      # three declared node20, which GitHub deprecated on 2025-09-19: the runner silently ran them
      # on node24 anyway and closed each job with a warning naming all three. That warning is not a
      # failure today, but it is the runner telling us it is compensating — and the compensation is
      # scheduled to stop. Bumped to the current majors, whose only breaking changes are the node24
      # runtime itself and an ESM repackaging; the inputs used below are unchanged across all of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # rebaseline-guard needs history to diff against the base

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Emberfall.slnx

      - name: Build (Release)
        run: dotnet build Emberfall.slnx -c Release --no-restore

      # ── Stage 1 — Lint + vocabulary + rebaseline-guard (BLOCKING) ───────────────
      - name: "Stage 1 · Lint (dotnet format)"
        run: dotnet format Emberfall.slnx --verify-no-changes --no-restore

      - name: "Stage 1 · Rebaseline guard"
        run: |
          chmod +x tools/ci/rebaseline-guard.sh
          base="origin/${{ github.base_ref || 'master' }}"
          tools/ci/rebaseline-guard.sh "$base"

      - name: "Stage 1 · Canonical vocabulary"
        shell: pwsh
        run: ./tools/ci/vocabulary-gate.ps1

      # ── Stage 2 — Core unit tests (BLOCKING, L1) ────────────────────────────────
      - name: "Stage 2 · Core unit tests"
        run: dotnet test Emberfall.slnx -c Release --no-build --filter "Category=Unit" --logger "trx;LogFileName=core-unit.trx" --results-directory artifacts

      # ── Stage 3 — Contract / interface tests (BLOCKING, L2) ─────────────────────
      - name: "Stage 3 · Contract tests"
        run: dotnet test Emberfall.slnx -c Release --no-build --filter "Category=Contract" --logger "trx;LogFileName=contract.trx" --results-directory artifacts

      # ── Stage 3b — Collection + CardValidation (BLOCKING) ───────────────────────
      # These two categories existed in the suite but were filtered by NO stage until
      # 2026-08-01 — a change could gut the collection backend with CI still green.
      # Run as their own step so a failure names the category instead of hiding in Stage 2.
      #
      # ADDING A NEW [Category("X")]? Add it to a stage here in the same commit, or it
      # runs nowhere and green stops meaning anything.
      #
      # EXCEPTION: Category=Nightly is deliberately excluded from every stage in this file.
      # It exists for tests too slow for a blocking per-push gate (real bot-vs-bot matches,
      # not fixture replays) and is gated instead by nightly.yml on its own schedule.
      - name: "Stage 3b · Collection + CardValidation"
        run: dotnet test Emberfall.slnx -c Release --no-build --filter "Category=Collection|Category=CardValidation" --logger "trx;LogFileName=collection-cardvalidation.trx" --results-directory artifacts

      # ── Stage 4 — Assembly firewall + banned-API (BLOCKING, criterion 7) ────────
      - name: "Stage 4 · Assembly firewall + banned-API"
        run: dotnet test Emberfall.slnx -c Release --no-build --filter "Category=Firewall" --logger "trx;LogFileName=firewall.trx" --results-directory artifacts

      # ── Stage 5 — Golden-replay, the R1 gate (BLOCKING, criterion 6) ────────────
      - name: "Stage 5 · Golden-replay (R1 gate)"
        run: dotnet test Emberfall.slnx -c Release --no-build --filter "Category=GoldenReplay" --logger "trx;LogFileName=golden-replay.trx" --results-directory artifacts

      # ── Stage 5b — Networked AI soak (BLOCKING as of EF-077) ───────────────────
      # Stage 5 replays PINNED fixtures through the engine in-process. This one plays NEW matches
      # through the whole shipped stack: the real ServerApp Kestrel host on an ephemeral 127.0.0.1
      # port, the real wire codec, real WebSocket sockets, and the real GreedyAi on BOTH seats to a
      # natural decided end. It is the only step here that can catch a break in the snapshot
      # PIPELINE rather than in the rules core.
      #
      # WHAT "hash-asserted" MEANS HERE — the two assertions already inside `liveai`, now gating:
      #   * the client's RC-F8 per-snapshot hash verify. Every snapshot the client applies is
      #     re-hashed and compared to the server's; a mismatch forces a resync and is tallied as an
      #     integrity failure. A non-zero tally exits 1.
      #   * the client's terminal outcome must AGREE with the outcome the server persisted in its
      #     own replay footer. A disagreement exits 1.
      # There is deliberately NO pinned digest for this stage: the match is not reproducible
      # run-to-run (same argv, different turn counts and different winners — measured), so a pinned
      # value could only be re-baked, never asserted. Pinned-digest determinism is Stage 5's job and
      # Stage 5 does it properly. See the EF-077 issue for the full finding.
      # `capped`, `undecided` and `rejects` also exit 1 — each is a real stall/timeout, not noise.
      #
      # WHY 5 MATCHES. Fixed cost is the ~6.4s process+server boot; each additional match is ~0.2s
      # (measured 1/5/10/20 → 6.6/7.4/8.7/10.0s), so 5 buys four extra matches for under a second.
      # One match is not enough to read the intent-mix rows the tool prints: a verb the AI simply
      # never reached in a single game is indistinguishable from a verb that no longer works over
      # the wire. Raise N here rather than adding a second soak step.
      - name: "Stage 5b · Networked AI soak (Emberfall.Tools.NetSoak liveai)"
        timeout-minutes: 10
        run: dotnet run --project src/Emberfall.Tools.NetSoak -c Release --no-build -- liveai 5

      # ── Stage 6 — Content validation, C-series (BLOCKING as of M2 WS C3) ────────
      # Pure-.NET card gate over the flat-file-per-set card JSON: C1-C21 per row via the
      # shared CardValidator, C2 duplicate-id across the library, artId->file check
      # (art misses WARN only — placeholder-art policy, M2 decision 18).
      - name: "Stage 6 · Content C-series card gate (Emberfall.Tools.CardCi)"
        run: dotnet run --project src/Emberfall.Tools.CardCi -c Release --no-build -- unity/Emberfall/Assets/CardData unity/Emberfall/Assets/Art

      # CardValidator C14b (above, via CardCi) already fails a fired trigger that declares an
      # ANY_* selector. This scan is NOT that check twice: its real job is the drift guard the
      # .NET side cannot do — it reads Targeting's selector switch and TargetSpec's default-choice
      # policy, then fails (exit 2) when either structural seam is incomplete. C14b is only as
      # true as that policy.
      - name: "Stage 6b · Trigger/selector drift guard (tooling/scripts)"
        run: python3 tooling/scripts/scan_unresolvable_trigger_selectors.py

      # CardCi (Stage 6 above) warns on missing art — placeholder-art policy, M2 decision 18.
      # This step closes the gap for artIds that point at filenames that never existed: it fails
      # (exit 1) when any artId in card data resolves to no .png on disk, which is breakage rather
      # than a placeholder. --fail-missing-only scopes the gate to artId resolution only; class-token
      # and set-folder findings are reported but do not block the build (they need Unity-Editor
      # intervention to rename PNGs without breaking Addressables guids).
      - name: "Stage 6b · Art-id resolution check (tooling/scripts)"
        run: python3 tooling/scripts/audit_card_art_names.py --fail-missing-only

      # ── Stages 7–8 — Unity E-series + PlayMode (informational at M1, no seat) ────
      # Nothing Unity-side is gated in cloud CI, and cannot be until there is a seat.
      # TWO local substitutes, and they are not interchangeable:
      #   tools/ci/unity-compile.ps1 — COMPILES the 12 Emberfall assemblies via dotnet. No
      #     Editor, no license, no domain reload, ~1 min. This is the pre-push gate, and the
      #     one to run when an Editor is already open (it is a single-writer resource).
      #   tools/ci/unity-verify.ps1  — drives a LOCAL headless Editor and runs HeadlessVerify's
      #     self-checks (EF-001). Fuller, slower; run before a release.
      # Compile coverage is the gap that actually bit: on 2026-08-06 a csproj-only
      # InternalsVisibleTo (invisible to Unity, which builds from the .asmdef) plus three
      # refactor-stale call sites passed every stage here and put the Editor in Safe Mode.
      # RETIREMENT TRIGGER: when a Unity seat lands, replace this echo with the real job
      # and drop the pre-push requirement from the agent AGENTS.md briefs.
      - name: "Stages 7–8 · Unity E-series + PlayMode (informational — no Unity seat at M1)"
        continue-on-error: true
        run: echo "No paid Unity seat at M1 (ci-gates.md §7 Q1). These become blocking at M2 with a Unity Pro/Build Server seat. Local pre-push gates are tools/ci/unity-compile.ps1 (fast, always) and tools/ci/unity-verify.ps1 (full, pre-release)."

      # ── Stage 9 — On-device perf gate (manual, milestone boundary) ──────────────
      - name: "Stage 9 · On-device perf gate D8 (manual device job)"
        continue-on-error: true
        run: echo "perf-gate.json is filled by the Performance Benchmarker on the baseline device at the milestone boundary (ci-gates.md §5.2) — not a cloud CI job."

      # ── Nightly corpus — folded in from the retired nightly.yml (2026-08-13) ────
      # Was its own workflow on its own 09:00 schedule. That paid a second checkout, a second
      # setup-dotnet and a second Release build (~1.2 min) to reach the same green tree this job
      # already has, then paid GitHub's per-job round-up on top. Same schedule, same runner,
      # nothing shared — so it is a step here instead, and nightly.yml is gone.
      #
      # [Category("Nightly")] is still excluded from every stage above: it is the slow corpus
      # (BotSeatRunnerTests plays a real bot-vs-bot match through 500-2000ms human-pacing delays,
      # ~2m30s) in a suite that is millisecond-scale everywhere else — Sam's ruling 2026-08-09,
      # ai-opponent-matchmaking-fallback. It runs on the daily tick, or on demand via the
      # `nightly` dispatch input when chasing a Nightly-only regression.
      - name: "Nightly · Category=Nightly (slow corpus)"
        if: github.event_name == 'schedule' || inputs.nightly
        timeout-minutes: 15
        run: dotnet test Emberfall.slnx -c Release --no-build --filter "Category=Nightly" --logger "trx;LogFileName=nightly.trx" --results-directory artifacts

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emberfall-gate-evidence
          path: artifacts/
          if-no-files-found: ignore
