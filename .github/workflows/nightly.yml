name: Emberfall nightly — slow test corpus

# Tests too slow for a blocking per-push gate ([Category("Nightly")]) — currently just
# BotSeatRunnerTests, a real bot-vs-bot match through 500-2000ms human-pacing delay per intent
# (~2m30s), sitting in a suite that is otherwise millisecond-scale everywhere else (Sam's ruling,
# 2026-08-09, ai-opponent-matchmaking-fallback memory). ci.yml's own "ADDING A NEW [Category]"
# rule is satisfied by this file, not by adding Nightly to a stage there.
#
# `workflow_dispatch` is here so a Nightly-only regression can be re-run on demand without
# waiting for the next scheduled tick.

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-slow-tests:
    name: Nightly (pure .NET, license-free)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Emberfall.slnx

      - name: Build (Release)
        run: dotnet build Emberfall.slnx -c Release --no-restore

      - name: "Nightly · Category=Nightly"
        timeout-minutes: 15
        run: dotnet test Emberfall.slnx -c Release --no-build --filter "Category=Nightly" --logger "trx;LogFileName=nightly.trx" --results-directory artifacts

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emberfall-nightly-evidence
          path: artifacts/
          if-no-files-found: ignore
