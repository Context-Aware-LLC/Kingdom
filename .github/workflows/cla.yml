# Asks each outside contributor to sign CLA.md on their first pull request, and fails the check
# until they do. Signatures are committed to the `cla-signatures` branch, never to master.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      # pull_request_target runs with write access, so the action is pinned to a commit (v2.6.1).
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v1.json
          path-to-document: https://github.com/Context-Aware-LLC/Kingdom/blob/master/CLA.md
          branch: cla-signatures
          allowlist: mrsonord2240,ContextAware-LLC,omni-nordaware,*[bot]
          lock-pullrequest-aftermerge: false
