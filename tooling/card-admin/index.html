<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emberfall — Card Corpus Admin Panel</title>
  <link rel="stylesheet" href="styles.css">
  </link>
  <script src="admin-panel.js" defer></script>

</head>

<body>
  <header>
    <h1>Emberfall — Card Corpus Admin Panel</h1>
    <span class="sub" id="source-note"></span>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="filter-group">
        <h3>Class</h3>
        <select id="f-class"></select>
      </div>
      <div class="filter-group">
        <h3>Cost range</h3>
        <div class="cost-row">
          <input type="number" id="f-cost-min" min="0" placeholder="min" />
          <span>–</span>
          <input type="number" id="f-cost-max" min="0" placeholder="max" />
        </div>
      </div>
      <div class="filter-group">
        <h3>Card type</h3>
        <div class="check-list" id="f-type"></div>
      </div>
      <div class="filter-group">
        <h3>Rarity</h3>
        <div class="check-list" id="f-rarity"></div>
      </div>
      <div class="filter-group">
        <h3>Keyword</h3>
        <div class="check-list wrap" id="f-tribe"></div>
      </div>
      <div class="filter-group">
        <h3>Tribe</h3>
        <div class="check-list wrap" id="f-keyword"></div>
      </div>
      <button class="reset" id="f-reset">Reset filters</button>
    </aside>

    <main class="content">
      <div class="scope-bar">
        <span class="count-pill" id="scope-count">—</span>
        <span class="muted" id="scope-desc"></span>
      </div>

      <div class="card span-2">
        <h2>Type split</h2>
        <div id="type-split"></div>
      </div>

      <div class="cards-grid" style="margin-top:16px">
        <div class="card">
          <h2>Keyword frequency</h2>
          <div class="bars" id="keyword-bars"></div>
        </div>
        <div class="card">
          <h2>Targeting selector frequency</h2>
          <div class="bars" id="selector-bars"></div>
        </div>
        <div class="card">
          <h2>Tribes</h2>
        <div class="bars" id="tribe-bars"></div>
      </div>

      <div class="card span-2" style="margin-top:16px">
        <h2>Cost distribution</h2>
        <div class="hist" id="cost-hist"></div>
      </div>

      <div class="card span-2" style="margin-top:16px">
        <h2>Minion attack / health distribution</h2>
        <div class="hist-wrap">
          <div class="hist-block">
            <h3>Attack</h3>
            <div class="hist" id="attack-hist"></div>
          </div>
          <div class="hist-block">
            <h3>Health</h3>
            <div class="hist" id="health-hist"></div>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:16px">

      </div>
    </main>
  </div>

  <script src="data.js"></script>

</body>

</html>
