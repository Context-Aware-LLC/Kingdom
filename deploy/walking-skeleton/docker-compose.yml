# Walking skeleton: Caddy (auto-TLS) in front of a minimal Kestrel wss echo. One command.
# DEPLOYED 2026-07-15 at wss://emberfall.outofcontext.to/ws (droplet root@24.144.123.177).

services:
  echo:
    build: ./EchoServer
    expose:
      - "5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - echo
    ports:
      - "80:80"
      - "443:443"
    # On hosts running systemd-resolved, containers inherit /etc/resolv.conf pointing at the
    # 127.0.0.53 stub, which is unreachable from the container netns — Caddy then can't resolve
    # the ACME endpoints and TLS issuance fails on silent retry. Pin real resolvers so auto-TLS works.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
