# Walking skeleton, B1 edition: Caddy (auto-TLS) in front of the REAL match server.
# The wss echo it replaced proved transport+TLS on 2026-07-15 (C-G0-6).
#
# RETIRED 2026-07-30 — this is the DigitalOcean droplet path and the droplet is gone (22/80/443
# all closed on 24.144.123.177). Production is fly.io, which builds `Dockerfile.server` straight
# from the repo root and terminates TLS itself, so neither Caddy nor this compose file is in the
# serving path. Kept for local full-stack runs and as the record of the B1 topology.

services:
  emberfall-server:
    build:
      context: ../..                                # repo root (RC F4): server needs src/ + card data
      dockerfile: deploy/walking-skeleton/Dockerfile.server
    expose:
      - "8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - KINGDOM_REPLAYS=/data/replays
    volumes:
      - replay_data:/data/replays
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - emberfall-server
    ports:
      - "80:80"
      - "443:443"
    # On hosts running systemd-resolved, containers inherit /etc/resolv.conf pointing at the
    # 127.0.0.53 stub, which is unreachable from the container netns — Caddy then can't resolve
    # the ACME endpoints and TLS issuance fails on silent retry. Pin real resolvers so auto-TLS works.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  replay_data:
