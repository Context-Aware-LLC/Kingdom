<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle and diagonal sword — layout preview</title>
<style>
@font-face { font-family: Stat; src: url('../../../unity/Assets/Art/Fonts/AlfaSlabOne-Regular.ttf'); }
* { box-sizing: border-box; }
body { margin: 0; padding: 32px; background: #242428; color: #eee6d8; font: 16px system-ui; }
h1 { margin: 0 0 8px; font-size: 22px; }
p { color: #c3bdaf; }
main { display: flex; flex-wrap: wrap; gap: 24px; }
figure { margin: 0; text-align: center; }
.badge { --base: 128px; --disc: calc(var(--base) * 1.15); position: relative; width: 300px; height: 300px; }
.badge img { position: absolute; object-fit: contain; }
.sword { z-index: 1; width: calc(var(--disc) * 1.8); height: calc(var(--disc) * 1.8); left: calc(50% + var(--disc) * .2); top: calc(50% - var(--disc) * .2); transform: translate(-50%, -50%) rotate(-45deg); }
.circle { z-index: 0; width: var(--disc); height: var(--disc); left: 50%; top: 50%; transform: translate(-50%, -50%); }
.number { z-index: 2; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: Stat, serif; font-size: calc(var(--base) * 220 / 256); line-height: 1; color: white; -webkit-text-stroke: 2px #171311; paint-order: stroke fill; }
figcaption { font-weight: 600; }
.small { --base: 40px; width: 120px; height: 120px; margin: 0 auto; }
.small .number { -webkit-text-stroke-width: 1px; }
</style>
<h1>Larger stat frames: circle → sword → number</h1>
<p>Frames are 15% larger; number sizes are unchanged. Circle below sword, number above both. Sample numbers; layout preview, not a Unity capture.</p>
<main>
<figure>
<div class="badge">
<img class="sword" src="../../../unity/Assets/Art/UI/Frames/socket_attack_sword.png" alt="">
<img class="circle" src="../../../unity/Assets/Art/UI/Frames/socket_attack.png" alt="Yellow minion power circle">
<span class="number">12</span>
</div>
<figcaption>Minion power</figcaption>
<div class="badge small">
<img class="sword" src="../../../unity/Assets/Art/UI/Frames/socket_attack_sword.png" alt="">
<img class="circle" src="../../../unity/Assets/Art/UI/Frames/socket_attack.png" alt="">
<span class="number">12</span>
</div>
</figure>
<figure>
<div class="badge">
<img class="sword" src="../../../unity/Assets/Art/UI/Frames/socket_weapon_power_sword.png" alt="">
<img class="circle" src="../../../unity/Assets/Art/UI/Frames/socket_health.png" alt="Red weapon power circle">
<span class="number">8</span>
</div>
<figcaption>Weapon power</figcaption>
<div class="badge small">
<img class="sword" src="../../../unity/Assets/Art/UI/Frames/socket_weapon_power_sword.png" alt="">
<img class="circle" src="../../../unity/Assets/Art/UI/Frames/socket_health.png" alt="">
<span class="number">8</span>
</div>
</figure>
<figure>
<div class="badge">
<img class="circle" src="../../../unity/Assets/Art/UI/Frames/socket_health_heart.png" alt="Red minion health heart">
<span class="number">8</span>
</div>
<figcaption>Minion health</figcaption>
</figure>
<figure>
<div class="badge">
<img class="circle" src="../../../unity/Assets/Art/UI/Frames/socket_weapon_toughness_shield.png" alt="Green weapon toughness shield">
<span class="number">5</span>
</div>
<figcaption>Weapon toughness</figcaption>
</figure></main>
</html>
