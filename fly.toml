# Fly.io deploy — Emberfall match server (trial spike, 2026-07-21).
# Build context is the repo ROOT (RC F4: Dockerfile.server needs src/ + card data),
# which is exactly where this file sits — so the dockerfile path is all Fly needs.

app = "emberfall"
primary_region = "sjc"

[build]
  dockerfile = "deploy/walking-skeleton/Dockerfile.server"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle (2026-07-21, Sam): no point paying for an empty lobby.
  #
  # Fly's autostop triggers on CONCURRENT CONNECTIONS reaching zero, not on wall-clock
  # idleness — a live match holds open WebSockets on both sides (kept alive by client
  # heartbeats, see 07742e2), so the proxy will NOT stop a machine mid-turn.
  #
  # "suspend" rather than "stop" on purpose: suspend snapshots RAM, so a B1 match living
  # in server memory survives the idle window. With "stop" it would not — and since no
  # volume is mounted, a stopped machine takes any in-flight match with it.
  #
  # KNOWN TRADE: if BOTH players blip simultaneously, connections hit zero and the machine
  # may suspend inside our 30s reconnect grace. Under "suspend" the match should resume;
  # if we ever fall back to "stop", that blip becomes an unrecoverable loss. Do not switch
  # to "stop" without persisting match state first.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# NOTE (trial scope): no volume mounted — /data/replays JSONL logs are ephemeral
# and lost on machine restart, same as the pre-B2 droplet caveat. Add a [mounts]
# volume if replay retention starts mattering here.
