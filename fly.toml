# Fly.io deploy — Kingdom match server (trial spike, 2026-07-21).
# Build context is the repo ROOT (RC F4: Dockerfile.server needs src/ + card data),
# which is exactly where this file sits — so the dockerfile path is all Fly needs.

app = "emberfall"
primary_region = "sjc"

[build]
  dockerfile = "deploy/walking-skeleton/Dockerfile.server"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle (2026-07-21, Sam): no point paying for an empty lobby.
  #
  # Fly's autostop triggers on CONCURRENT CONNECTIONS reaching zero, not on wall-clock
  # idleness — a live match holds open WebSockets on both sides (kept alive by client
  # heartbeats, see 07742e2), so the proxy will NOT stop a machine mid-turn.
  #
  # "suspend" rather than "stop" on purpose: suspend snapshots RAM, so a B1 match living
  # in server memory survives the idle window. With "stop" it would not — and since no
  # volume is mounted, a stopped machine takes any in-flight match with it.
  #
  # KNOWN TRADE: if BOTH players blip simultaneously, connections hit zero and the machine
  # may suspend inside our 30s reconnect grace. Under "suspend" the match should resume;
  # if we ever fall back to "stop", that blip becomes an unrecoverable loss. Do not switch
  # to "stop" without persisting match state first.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

# SINGLE MACHINE, DELIBERATELY. Machine count is not expressible here — it is set with
# `fly scale count 1 -a emberfall`, and `fly launch` defaults to TWO for HA.
#
# Two machines is a correctness bug for this server, not redundancy: B1 keeps matches in
# process memory and matchmaking pairs players inside one process, so two players can land
# on different machines and sit in separate empty lobbies, each seeing sessions=0. It looks
# healthy from outside — both machines pass /healthz — which is what makes it nasty.
#
# `fly launch` created a second machine on 2026-07-21; destroyed the same day. If you ever
# see 2 machines again, that is the bug, not capacity. Scaling out needs shared matchmaking
# state first (D5/B2 work).
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Durable storage for replays + telemetry (C-G1-8, 2026-07-22). Dockerfile.server already
# sets EMBERFALL_REPLAYS=/data/replays, so /data is the mount point and nothing in the image
# changes. Volume vol_rkgwj19p5yykeyo4, 1 GB, sjc — created 2026-07-22.
#
# WHAT THIS FIXES AND WHAT IT DOES NOT. The volume survives machine stop/suspend/restart and
# survives `fly deploy`, which is the hole that mattered: without it, telemetry died on every
# restart and G2 would have read n=0 no matter how many matches were played. It is NOT a
# backup. A Fly volume is a slice of NVMe on ONE physical host, tied to that hardware, with no
# replication — Fly's own guidance is to run two volumes per app, and we run one. Lose the
# host, lose the data. That trade is accepted for telemetry + replays (regenerable, and losing
# a window of it costs a measurement, not a player). It is exactly why ACCOUNTS go to Supabase
# and never here. Fly takes daily block-level snapshots, retained 5 days.
#
# DEPLOY GOTCHA: adding a mount to an existing machine forces Fly to REPLACE that machine
# rather than update it in place. Harmless — nothing durable lives there yet — but it means
# the next `fly deploy` is a machine swap, and any in-memory match at that moment is lost.
#
# ONE MACHINE, ONE VOLUME — see the scaling note above. `fly scale count 2` would fork this
# volume into a second, unsynced copy, which is a worse bug than the matchmaking split it
# already causes.
[mounts]
  source = "emberfall_data"
  destination = "/data"
